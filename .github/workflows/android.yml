name: Application Android

on:
  push:
    branches: [main]
    paths: ["src/**", "public/**", "index.html", "scripts/build.mjs", "android-ressources/**", "capacitor.config.json", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Construire la page
        run: |
          npm install --no-audit --no-fund
          npm run apk
          rm -f dist/sw.js
      - name: Préparer le projet Android
        run: |
          npm install --no-save --no-audit --no-fund @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap add android
          pip install pillow
          python android-ressources/remplacer.py
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          npx cap sync android
      - name: Compiler
        run: cd android && ./gradlew assembleRelease --no-daemon -q
      - name: Signer
        run: |
          BT=$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          APK=android/app/build/outputs/apk/release/app-release-unsigned.apk
          $ANDROID_HOME/build-tools/$BT/zipalign -f -p 4 $APK aligne.apk
          $ANDROID_HOME/build-tools/$BT/apksigner sign --ks android-ressources/cle-leonie.jks --ks-pass pass:leonie-encyclopedie --key-pass pass:leonie-encyclopedie --out encyclopedie-de-la-vie.apk aligne.apk
          ls -la encyclopedie-de-la-vie.apk
      - name: Publier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-${{ github.run_number }}" encyclopedie-de-la-vie.apk \
            --title "Application Android, version 1.${{ github.run_number }}" \
            --notes "Télécharger encyclopedie-de-la-vie.apk sur le téléphone Android, l'ouvrir et accepter l'installation. Tout est dans l'application : elle marche sans Internet." \
            --latest
