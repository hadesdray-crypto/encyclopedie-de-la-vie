name: Application Android

on:
  push:
    branches: [main]
    paths: ["src/**", "public/**", "index.html", "scripts/build.mjs", "android-ressources/**", "capacitor.config.json", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Construire la page
        run: |
          npm install --no-audit --no-fund
          APK_VERSION=${{ github.run_number }} npm run apk
          rm -f dist/sw.js
          # Paquet de mise à jour : l'application le télécharge elle-même, sans rien réinstaller.
          (cd dist && zip -qr ../web.zip .)
          ls -la web.zip
      - name: Préparer le projet Android
        run: |
          npm install --save --no-audit --no-fund @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor-community/text-to-speech@6 @capgo/capacitor-updater@7 @capacitor/app@7
          npx cap add android
          pip install pillow
          python android-ressources/remplacer.py
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          npx cap sync android
          echo "Modules du téléphone inclus :"; cat android/app/src/main/assets/capacitor.plugins.json
          # Sécurité : on s'arrête si la voix ou la mise à jour manquent.
          grep -q TextToSpeech android/app/src/main/assets/capacitor.plugins.json
          grep -q CapacitorUpdater android/app/src/main/assets/capacitor.plugins.json
          grep -q '"App"\|capacitor-app\|AppPlugin' android/app/src/main/assets/capacitor.plugins.json
      - name: Compiler
        run: cd android && ./gradlew assembleRelease --no-daemon -q
      - name: Signer
        run: |
          BT=$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          APK=android/app/build/outputs/apk/release/app-release-unsigned.apk
          $ANDROID_HOME/build-tools/$BT/zipalign -f -p 4 $APK aligne.apk
          $ANDROID_HOME/build-tools/$BT/apksigner sign --ks android-ressources/cle-leonie.jks --ks-pass pass:leonie-encyclopedie --key-pass pass:leonie-encyclopedie --out encyclopedie-de-la-vie.apk aligne.apk
          ls -la encyclopedie-de-la-vie.apk
      - name: Publier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-${{ github.run_number }}" encyclopedie-de-la-vie.apk web.zip \
            --title "Application Android, version 1.${{ github.run_number }}" \
            --notes "Ouvrir ce fichier sur le téléphone Android et toucher Installer. Tout est dans l'application : elle marche sans Internet. Pour une mise à jour, installer simplement la nouvelle version par-dessus : rien n'est perdu." \
            --latest
