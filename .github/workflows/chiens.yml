name: Chiens de Plume

on:
  push:
    branches: [chiens]
    paths: [scripts/donnees/chiens.py, scripts/donnees/chiens-etape.txt, .github/workflows/chiens.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  chiens:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Collecter
        run: python scripts/donnees/chiens.py $(cat scripts/donnees/chiens-etape.txt)
      - name: Enregistrer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898281+github-actions[bot]@users.noreply.github.com"
          git add -A src/data public
          git diff --cached --quiet || (git commit -q -m "Données : chiens de Plume" && git pull -q --rebase origin chiens && git push -q origin HEAD:chiens)
