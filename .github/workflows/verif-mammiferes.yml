name: Vérification des noms de mammifères

on:
  push:
    branches: [verif-mammiferes]
    paths: [scripts/verif/mammiferes-*.py]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verif-mammiferes
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sonde des sources
        run: '[ -f scripts/verif/mammiferes-sonde.py ] && timeout 5m python scripts/verif/mammiferes-sonde.py || true'
      - name: Interroger les sources
        run: '[ -f scripts/verif/mammiferes-sonde-seule ] || timeout 50m python scripts/verif/mammiferes-noms.py || true'
      - name: Enregistrer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898281+github-actions[bot]@users.noreply.github.com"
          git add scripts/verif/mammiferes-resultats.json
          git diff --cached --quiet || (git commit -q -m "Noms de mammifères : résultats des sources" && git pull -q --rebase -X theirs origin verif-mammiferes && git push -q origin HEAD:verif-mammiferes)
