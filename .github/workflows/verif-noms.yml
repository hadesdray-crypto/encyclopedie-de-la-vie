name: Vérifier les noms des oiseaux
on:
  push:
    branches: [verif-noms]
    paths: [scripts/verif/latins.txt]
permissions:
  contents: write
jobs:
  verif:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verif-noms
      - run: sudo apt-get install -y poppler-utils
      - run: timeout 40m python scripts/verif/noms.py || true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898281+github-actions[bot]@users.noreply.github.com"
          git add scripts/verif && git commit -m "Résultats de la vérification des noms" && git pull --rebase -X theirs && git push
