name: Oiseaux de Plume

on:
  push:
    branches: [oiseaux]
    paths: [scripts/donnees/oiseaux-etape.txt]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  oiseaux:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          ref: oiseaux
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: sudo apt-get install -y ffmpeg
      - name: Collecter
        run: python scripts/donnees/oiseaux.py $(cat scripts/donnees/oiseaux-etape.txt) 2>&1 | tee scripts/donnees/oiseaux-journal.txt
      - name: Enregistrer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898281+github-actions[bot]@users.noreply.github.com"
          git add -A src/data public scripts/donnees/oiseaux-journal.txt
          git diff --cached --quiet || (git commit -q -m "Données : oiseaux de Plume" && git pull -q --rebase origin oiseaux && git push -q origin HEAD:oiseaux)
