name: Trajets GPS

on:
  push:
    branches: [suivi-repare]
    paths: [scripts/donnees/trajets.py]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trajets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: set -o pipefail; python scripts/donnees/trajets.py 2>&1 | tee scripts/donnees/trajets-journal.txt
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898281+github-actions[bot]@users.noreply.github.com"
          git add -A src/data/trajets.json scripts/donnees/trajets-journal.txt
          git diff --cached --quiet || (git commit -q -m "Données : trajets GPS" && git push -q origin HEAD:suivi-repare)
