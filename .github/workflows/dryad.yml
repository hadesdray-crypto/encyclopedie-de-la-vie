name: Grands voyageurs (Dryad)

on:
  push:
    branches: [voyageurs-dryad]
    paths: [scripts/donnees/dryad.py]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dryad:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -u scripts/donnees/dryad.py 2>&1 | tee scripts/donnees/dryad-journal.txt
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898281+github-actions[bot]@users.noreply.github.com"
          git add -A src/data/voyageurs-dryad.json scripts/donnees/dryad-journal.txt
          git diff --cached --quiet || (git commit -q -m "Données : voyageurs Dryad" && git push -q origin HEAD:voyageurs-dryad)
