name: Sonde COMBINE
on:
  push:
    branches: [combine-sonde]
permissions:
  contents: write
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Chercher COMBINE sur figshare et lire les colonnes
        run: |
          exec > sonde.txt 2>&1
          curl -s https://api.figshare.com/v2/articles/13028255/files | python3 -c "import sys,json; [print(f['name'], f['size'], f['download_url']) for f in json.load(sys.stdin)]"
          for u in $(curl -s https://api.figshare.com/v2/articles/13028255/files | python3 -c "import sys,json; print(' '.join(f['download_url'] for f in json.load(sys.stdin)))"); do curl -sL -o f.bin "$u"; echo "== $u"; file f.bin; (unzip -Z1 f.bin 2>/dev/null | head -30); for c in $(unzip -Z1 f.bin 2>/dev/null | grep -i 'trait.*csv'); do echo "-- $c"; unzip -p f.bin "$c" | head -1; done; done
      - name: Garder le résultat
        if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898281+github-actions[bot]@users.noreply.github.com"
          git add sonde.txt; git commit -qm "Résultat de la sonde" || true; git push -q
