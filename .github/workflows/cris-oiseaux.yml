name: Cris d'oiseaux

on:
  push:
    branches: [sons-oiseaux]
    paths: [scripts/donnees/cris-oiseaux-etape.txt]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cris:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sons-oiseaux
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow numpy
      - run: sudo apt-get install -y ffmpeg
      - name: Collecter
        env:
          XC_API_KEY: ${{ secrets.XC_API_KEY }}
        run: timeout 330m python scripts/donnees/cris_oiseaux.py $(cat scripts/donnees/cris-oiseaux-etape.txt) 2>&1 | tee scripts/donnees/cris-oiseaux-journal.txt
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898281+github-actions[bot]@users.noreply.github.com"
          git add -A src/data public scripts/donnees/cris-oiseaux-journal.txt
          git diff --cached --quiet || (git commit -q -m "Données : cris d'oiseaux" && git pull -q --rebase -X theirs origin sons-oiseaux && git push -q origin HEAD:sons-oiseaux)
