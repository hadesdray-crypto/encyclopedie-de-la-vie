name: Animaux les plus connus

on:
  push:
    branches: [notoriete]
    paths: [scripts/donnees/notoriete.py]

permissions:
  contents: write

jobs:
  notoriete:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -u scripts/donnees/notoriete.py 2>&1 | tee scripts/donnees/notoriete-journal.txt
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898281+github-actions[bot]@users.noreply.github.com"
          git add -A src/data/notoriete.json scripts/donnees/notoriete-journal.txt
          git diff --cached --quiet || (git commit -q -m "Données : animaux les plus connus" && git push -q origin HEAD:${GITHUB_REF_NAME})
