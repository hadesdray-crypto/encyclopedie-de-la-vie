name: Cris Xeno-canto

on:
  push:
    branches: [sons-xc]
    paths: [scripts/donnees/sons_xc.py]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sons:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: python -u scripts/donnees/sons_xc.py 2>&1 | tee scripts/donnees/sons-xc-journal.txt
        env:
          XC_API_KEY: ${{ secrets.XC_API_KEY }}
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898281+github-actions[bot]@users.noreply.github.com"
          git add -A src/data public/s scripts/donnees/sons-xc-journal.txt
          git diff --cached --quiet || (git commit -q -m "Données : cris Xeno-canto" && git push -q origin HEAD:sons-xc)
