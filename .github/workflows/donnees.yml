name: Collecter les données

on:
  workflow_dispatch:
    inputs:
      etapes:
        description: "Étapes : noms resumes photos galerie cris"
        default: "noms resumes photos galerie cris"
      limite:
        description: "Nombre d'espèces (0 = toutes)"
        default: "0"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: donnees
  cancel-in-progress: false

jobs:
  collecter:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Collecter
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898281+github-actions[bot]@users.noreply.github.com"
          for e in ${{ github.event.inputs.etapes }}; do
            timeout 300m python scripts/donnees/collecter.py $e --limite ${{ github.event.inputs.limite }} || echo "étape $e incomplète"
            git add -A src/data public
            git diff --cached --quiet || git commit -q -m "Données : étape $e"
            git push -q -f origin HEAD:refs/heads/donnees-auto
          done
      - name: Demander l'accord pour publier
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch -q origin main donnees-auto || exit 0
          if git diff --quiet origin/main origin/donnees-auto -- src/data public; then echo "Rien de nouveau."; exit 0; fi
          if [ -n "$(gh pr list --head donnees-auto --state open --json number --jq '.[0].number')" ]; then echo "Demande déjà ouverte, mise à jour."; exit 0; fi
          gh pr create --base main --head donnees-auto \
            --title "Nouvelles données : ${{ github.event.inputs.etapes }}" \
            --body "Données récupérées automatiquement (étapes : ${{ github.event.inputs.etapes }}).

          Sources : Wikidata, Wikipédia, iNaturalist. Licences libres seulement, avec le nom de l'auteur.

          **Rien n'est publié tant que tu n'as pas accepté.** Pour publier : « Merge pull request » puis « Confirm merge ». Pour refuser : « Close pull request »."
