name: Collecter les données

on:
  workflow_dispatch:
    inputs:
      etapes:
        description: "Étapes : noms resumes photos galerie cris"
        default: "noms resumes photos galerie cris"
      limite:
        description: "Nombre d'espèces (0 = toutes)"
        default: "0"

permissions:
  contents: write
  actions: write

concurrency:
  group: donnees
  cancel-in-progress: false

jobs:
  collecter:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Collecter
        run: |
          for e in ${{ github.event.inputs.etapes }}; do
            timeout 300m python scripts/donnees/collecter.py $e --limite ${{ github.event.inputs.limite }} || echo "étape $e incomplète"
            git config user.name "github-actions[bot]"
            git config user.email "41898281+github-actions[bot]@users.noreply.github.com"
            git add -A src/data public
            git diff --cached --quiet || git commit -q -m "Données : étape $e"
            git pull -q --rebase origin main && git push -q origin HEAD:main
          done
      - name: Republier le site
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
