name: Liens des voyageurs

on:
  push:
    branches: [voyageurs-liens]
    paths: [scripts/donnees/liens_movebank.py]

permissions:
  contents: write

jobs:
  liens:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -u scripts/donnees/liens_movebank.py 2>&1 | tee scripts/donnees/liens-journal.txt
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898281+github-actions[bot]@users.noreply.github.com"
          git add -A src/data/voyageurs-liens.json scripts/donnees/liens-journal.txt
          git diff --cached --quiet || (git commit -q -m "Données : liens des voyageurs" && git push -q origin HEAD:${GITHUB_REF_NAME})
