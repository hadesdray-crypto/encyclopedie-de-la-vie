name: Cris vérifiés

on:
  push:
    branches: [sons]
    paths: [scripts/donnees/sons.py]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sons:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q "numpy<2" birdnetlib tflite-runtime librosa resampy soundfile
      - name: Analyser
        run: set -o pipefail; python scripts/donnees/sons.py 2>&1 | tee scripts/donnees/sons-journal.txt
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898281+github-actions[bot]@users.noreply.github.com"
          git add -A src/data public/s scripts/donnees/sons-journal.txt
          git diff --cached --quiet || (git commit -q -m "Données : cris vérifiés" && git pull -q --rebase origin sons && git push -q origin HEAD:sons)
