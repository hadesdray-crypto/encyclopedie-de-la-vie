name: Cris et photos des mammifères

on:
  push:
    branches: [sons]
    paths: [scripts/donnees/sons-etape.txt]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sons:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sons
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: sudo apt-get install -y ffmpeg
      - name: Collecter
        run: timeout 300m python scripts/donnees/sons.py $(cat scripts/donnees/sons-etape.txt) 2>&1 | tee scripts/donnees/sons-journal.txt
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898281+github-actions[bot]@users.noreply.github.com"
          git add -A src/data public scripts/donnees/sons-journal.txt
          git diff --cached --quiet || (git commit -q -m "Données : cris et photos de mammifères" && git pull -q --rebase -X theirs origin sons && git push -q origin HEAD:sons)
